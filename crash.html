<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Падение хлеба</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
    .graph-container {
        height: 300px;
        background: linear-gradient(#1b2735, #0d1117);
    }
    #crash-graph {
        display: block;
        width: 100%;
        height: 100%;
    }
    </style>
</head>
<body class="bg-dark text-light" data-auth="user">
<div class="container mt-4">
    <div id="flash-area"></div>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-10">
                <div class="game-container crash-container card bg-dark text-white p-4">
                    <h2 class="text-center mb-4">🍞 Падение хлеба</h2>

                    <!-- Игровое поле -->
                    <div class="crash-game">
                        <div class="multiplier text-center mb-3">
                            <h3 id="current-multiplier">1.00x</h3>
                            <div id="game-status" class="text-warning fs-5">Ожидание игроков...</div>
                        </div>

                        <div class="graph-container position-relative rounded mb-3 overflow-hidden">
                            <canvas id="crash-graph"></canvas>
                            <div id="betting-timer" class="position-absolute top-0 start-50 translate-middle-x mt-2 text-white fs-1" style="display: none;"></div>
                        </div>

                        <div class="history mb-3">
                            <h5>История раундов:</h5>
                            <div id="round-history" class="d-flex flex-wrap justify-content-center"></div>
                        </div>
                    </div>

                    <!-- Панель управления -->
                    <div class="control-panel mt-4 card bg-secondary text-white p-3">
                        <div class="row align-items-center">
                            <div class="col-md-4">
                                <div class="form-group mb-2">
                                    <label for="bet-amount" class="form-label">Сумма ставки</label>
                                    <input type="number" class="form-control bg-dark text-white border-secondary" id="bet-amount" min="1" value="10">
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="form-group mb-2">
                                    <label for="auto-cashout" class="form-label">Авто-кэшаут (x), можно оставить пустым</label>
                                    <input type="number" class="form-control bg-dark text-white border-secondary" id="auto-cashout" min="1.01" value="2.00" step="0.01">
                                </div>
                            </div>
                            <div class="col-md-4">
                                <button class="btn btn-primary w-100 mb-2" id="place-bet-button">Сделать ставку</button>
                                <button class="btn btn-danger w-100 mb-2" id="cashout-button" style="display: none;">Забрать выигрыш</button>
                            </div>
                        </div>
                        <div id="user-bet-status" class="mt-2 text-center"></div>
                    </div>

                    <!-- Результаты -->
                    <div class="results mt-4" id="round-results" style="display: none;">
                        <h5>Результаты раунда:</h5>
                        <div id="round-crash-point" class="alert alert-danger text-center"></div>
                        <div id="user-round-result" class="alert text-center"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/store.js"></script>
<script src="js/layout.js"></script>
<script>
Casino.ready(() => {
// Параметры раунда (как в games/crash.py)
const BETTING_PHASE_MS = 10000;
const WAIT_BETWEEN_ROUNDS_MS = 5000;
const UPDATE_INTERVAL_MS = 50;
const GROWTH_RATE = 0.1; // множитель = 2^(секунды * GROWTH_RATE)

const multiplierElement = document.getElementById('current-multiplier');
const gameStatusElement = document.getElementById('game-status');
const graphContainer = document.querySelector('.graph-container');
const canvas = document.getElementById('crash-graph');
const ctx = canvas.getContext('2d');
const betAmountInput = document.getElementById('bet-amount');
const autoCashoutInput = document.getElementById('auto-cashout');
const placeBetButton = document.getElementById('place-bet-button');
const cashoutButton = document.getElementById('cashout-button');
const roundResultsDiv = document.getElementById('round-results');
const roundCrashPointDiv = document.getElementById('round-crash-point');
const userRoundResultDiv = document.getElementById('user-round-result');
const roundHistoryDiv = document.getElementById('round-history');
const bettingTimerDiv = document.getElementById('betting-timer');
const userBetStatusDiv = document.getElementById('user-bet-status');

let gameState = 'waiting'; // waiting, betting, running, crashed
let crashPoint = null;
let currentMultiplier = 1.0;
let phaseEndsAt = 0;
let startTime = 0;
let timer = null;
let bet = null; // { amount, autoCashout, cashoutMultiplier, winAmount }

// Генерирует точку краша так, что P(crash <= x) ≈ 1 - 1/x
function calculateCrashPoint() {
    while (true) {
        const randomValue = 0.05 + Math.random() * 0.95;
        const crash = 1 / (1 - randomValue);
        if (crash >= 1.01) {
            return Math.round(Math.min(crash, 200.0) * 100) / 100;
        }
    }
}

// --- Сцена: ломтик хлеба стоит на ребре, качается и падает ---

const FALL_ACCELERATION = 10; // рад/с² — как быстро хлеб заваливается
const DEPTH_TILT = 0.38;      // насколько видна поверхность стола (наклон камеры)
const BREAD_COLORS = { crust: '#b8742a', crustDark: '#8a5219', crumb: '#f3d9a4', pore: '#d9b77a' };

let tilt = 0;          // наклон вокруг нижнего ребра, рад; > 0 — вперед на зрителя, < 0 — назад
let wobblePhase = 0;
let fall = null;       // { dir, velocity, bounced, settled }
let crumbs = [];
let lastFrameTime = performance.now();

function resizeCanvas() {
    canvas.width = graphContainer.clientWidth;
    canvas.height = graphContainer.clientHeight;
}

function sceneMetrics() {
    const baseY = canvas.height - 85;
    const height = Math.min(140, canvas.height * 0.5, canvas.width * 0.28);
    return {
        baseY,
        height,
        width: height * 0.72,
        centerX: canvas.width / 2,
        tableFar: baseY - height * DEPTH_TILT - 12,
        tableNear: canvas.height - 18
    };
}

// Контур ломтика: низ на y = 0, верх на y = -h, с «плечами» сверху
function slicePath(w, h) {
    const r = w * 0.08;
    ctx.beginPath();
    ctx.moveTo(-w / 2 + r, 0);
    ctx.lineTo(w / 2 - r, 0);
    ctx.quadraticCurveTo(w / 2, 0, w / 2, -r);
    ctx.lineTo(w / 2, -0.58 * h);
    ctx.bezierCurveTo(w / 2 + 0.16 * w, -0.62 * h, w / 2 + 0.18 * w, -0.93 * h, 0.22 * w, -0.98 * h);
    ctx.bezierCurveTo(0.08 * w, -1.02 * h, -0.08 * w, -1.02 * h, -0.22 * w, -0.98 * h);
    ctx.bezierCurveTo(-w / 2 - 0.18 * w, -0.93 * h, -w / 2 - 0.16 * w, -0.62 * h, -w / 2, -0.58 * h);
    ctx.lineTo(-w / 2, -r);
    ctx.quadraticCurveTo(-w / 2, 0, -w / 2 + r, 0);
    ctx.closePath();
}

function drawSlice(w, h) {
    slicePath(w, h);
    ctx.fillStyle = BREAD_COLORS.crust;
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = BREAD_COLORS.crustDark;
    ctx.stroke();

    // Мякиш — тот же контур, уменьшенный к центру ломтика
    ctx.save();
    ctx.translate(0, -h * 0.5);
    ctx.scale(0.84, 0.86);
    ctx.translate(0, h * 0.5);
    slicePath(w, h);
    ctx.fillStyle = BREAD_COLORS.crumb;
    ctx.fill();
    ctx.restore();

    // Поры
    ctx.fillStyle = BREAD_COLORS.pore;
    [[-0.2, 0.25, 0.035], [0.15, 0.35, 0.03], [-0.05, 0.55, 0.04], [0.22, 0.7, 0.03],
     [-0.25, 0.72, 0.025], [0.05, 0.82, 0.03], [-0.12, 0.4, 0.02], [0.25, 0.18, 0.025]].forEach(([x, y, r]) => {
        ctx.beginPath();
        ctx.ellipse(x * w, -y * h, r * w * 1.3, r * w, 0, 0, Math.PI * 2);
        ctx.fill();
    });
}

// Применяет к контексту положение ломтика: локальные координаты ломтика -> холст
function applyBreadTransform(m) {
    // Поворот вокруг нижнего ребра к зрителю/от зрителя в упрощенной перспективе
    const scaleY = Math.cos(tilt) - DEPTH_TILT * Math.sin(tilt);
    const scaleX = 1 + 0.12 * Math.sin(tilt) * Math.abs(Math.sin(tilt));
    ctx.translate(m.centerX, m.baseY);
    ctx.scale(scaleX, scaleY);
}

function slicePointToCanvas(localX, localY, m) {
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    applyBreadTransform(m);
    const point = new DOMPoint(localX, localY).matrixTransform(ctx.getTransform());
    ctx.restore();
    return point;
}

function spawnCrumbs(m) {
    const top = slicePointToCanvas(0, -m.height * 0.95, m);
    for (let i = 0; i < 20; i++) {
        crumbs.push({
            x: top.x + (Math.random() - 0.5) * 24,
            y: top.y,
            floor: top.y + 2 + Math.random() * 10,
            vx: (Math.random() - 0.5) * 320,
            vy: -80 - Math.random() * 240,
            r: 1.5 + Math.random() * 2.5
        });
    }
}

function updateScene(dt) {
    const now = Date.now();
    if (gameState === 'running') {
        // Чем выше множитель, тем сильнее и чаще качается хлеб
        const growth = Math.log(Math.max(currentMultiplier, 1));
        const amplitude = Math.min(0.035 + growth * 0.15, 0.42);
        const speed = 2.5 + growth * 2.2;
        wobblePhase += speed * dt;
        tilt = amplitude * Math.sin(wobblePhase) + 0.01 * Math.sin(now / 37);
    } else if (gameState === 'crashed' && fall && !fall.settled) {
        fall.velocity += fall.dir * FALL_ACCELERATION * dt;
        tilt += fall.velocity * dt;
        if (fall.dir * tilt >= Math.PI / 2) {
            tilt = fall.dir * Math.PI / 2;
            if (!fall.bounced) {
                fall.bounced = true;
                fall.velocity = -fall.velocity * 0.22;
                fall.landed = true;
            } else {
                fall.settled = true;
                fall.velocity = 0;
            }
        }
    } else if (gameState === 'betting' || gameState === 'waiting') {
        tilt = 0;
    }

    crumbs.forEach(c => {
        c.vy += 900 * dt;
        c.x += c.vx * dt;
        c.y += c.vy * dt;
        if (c.y > c.floor) {
            c.y = c.floor;
            c.vy = 0;
            c.vx *= 0.8;
        }
    });
}

function drawTable(m) {
    // Столешница в перспективе: дальний край уже, ближний шире
    const inset = canvas.width * 0.08;
    ctx.fillStyle = '#6b4528';
    ctx.beginPath();
    ctx.moveTo(inset, m.tableFar);
    ctx.lineTo(canvas.width - inset, m.tableFar);
    ctx.lineTo(canvas.width, m.tableNear);
    ctx.lineTo(0, m.tableNear);
    ctx.closePath();
    ctx.fill();
    // Ближний торец стола
    ctx.fillStyle = '#4a2f1b';
    ctx.fillRect(0, m.tableNear, canvas.width, canvas.height - m.tableNear);
    // Волокна дерева
    ctx.strokeStyle = 'rgba(0, 0, 0, 0.12)';
    ctx.lineWidth = 1;
    for (let i = 1; i < 5; i++) {
        const y = m.tableFar + (m.tableNear - m.tableFar) * i / 5;
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(canvas.width, y);
        ctx.stroke();
    }
}

function drawScene(m) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawTable(m);

    // Тень под хлебом (всегда на поверхности стола)
    const center = slicePointToCanvas(0, -m.height / 2, m);
    const lyingDepth = Math.abs(Math.sin(tilt));
    ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
    ctx.beginPath();
    ctx.ellipse(center.x, m.baseY + (tilt > 0 ? m.height * DEPTH_TILT * lyingDepth * 0.5 : 0) + 3,
                m.width * 0.75, 7 + 10 * lyingDepth, 0, 0, Math.PI * 2);
    ctx.fill();

    // Толщина ломтика видна, когда он ложится плашмя
    if (lyingDepth > 0.05) {
        ctx.save();
        ctx.translate(0, 9 * lyingDepth);
        applyBreadTransform(m);
        slicePath(m.width, m.height);
        ctx.fillStyle = BREAD_COLORS.crustDark;
        ctx.fill();
        ctx.restore();
    }

    ctx.save();
    applyBreadTransform(m);
    drawSlice(m.width, m.height);
    ctx.restore();

    if (fall && fall.landed) {
        fall.landed = false;
        spawnCrumbs(m);
    }

    ctx.fillStyle = BREAD_COLORS.crust;
    crumbs.forEach(c => {
        ctx.beginPath();
        ctx.arc(c.x, c.y - c.r, c.r, 0, Math.PI * 2);
        ctx.fill();
    });

    if (gameState === 'crashed') {
        ctx.fillStyle = '#dc3545';
        ctx.font = 'bold 32px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'top';
        ctx.fillText('ХЛЕБ УПАЛ!', canvas.width / 2, 16);
    }
}

function sceneLoop(now) {
    const dt = Math.min((now - lastFrameTime) / 1000, 0.05);
    lastFrameTime = now;
    updateScene(dt);
    drawScene(sceneMetrics());
    requestAnimationFrame(sceneLoop);
}

// Хлеб заваливается в ту сторону, куда уже наклонился
function toppleBread() {
    const dir = Math.abs(tilt) > 0.01 ? Math.sign(tilt) : (Math.random() < 0.5 ? -1 : 1);
    fall = { dir: dir, velocity: dir * 0.8, bounced: false, settled: false, landed: false };
}

// Новый раунд: хлеб снова стоит, куда он качнется первым — случайно
function resetBread() {
    fall = null;
    crumbs = [];
    tilt = 0;
    wobblePhase = Math.random() < 0.5 ? 0 : Math.PI;
}

function updateUI() {
    const now = Date.now();
    const secondsLeft = Math.max(0, (phaseEndsAt - now) / 1000);

    gameStatusElement.textContent = {
        'waiting': 'Ожидание следующего раунда...',
        'betting': `Ставки: ${secondsLeft.toFixed(1)} сек`,
        'running': 'Игра идет...',
        'crashed': `Крах на ${crashPoint !== null ? crashPoint.toFixed(2) : '--'}x`
    }[gameState];

    multiplierElement.textContent = currentMultiplier.toFixed(2) + 'x';

    bettingTimerDiv.style.display = gameState === 'betting' ? 'block' : 'none';
    bettingTimerDiv.textContent = Math.ceil(secondsLeft);

    const hasActiveBet = bet !== null && bet.cashoutMultiplier === null;
    placeBetButton.style.display = gameState === 'running' ? 'none' : 'block';
    placeBetButton.disabled = gameState !== 'betting' || bet !== null;
    cashoutButton.style.display = gameState === 'running' && hasActiveBet ? 'block' : 'none';
}

function addRoundToHistory(point) {
    const span = document.createElement('span');
    span.className = 'badge me-1 mb-1';
    span.textContent = `${point.toFixed(2)}x`;
    if (point < 2.00) {
        span.classList.add('bg-danger');
    } else if (point < 10.00) {
        span.classList.add('bg-warning');
    } else {
        span.classList.add('bg-success');
    }
    roundHistoryDiv.prepend(span);
    while (roundHistoryDiv.children.length > 20) {
        roundHistoryDiv.removeChild(roundHistoryDiv.lastChild);
    }
}

// --- Игровой цикл ---

function startBetting() {
    clearInterval(timer);
    gameState = 'betting';
    crashPoint = calculateCrashPoint();
    currentMultiplier = 1.0;
    bet = null;
    resetBread();
    phaseEndsAt = Date.now() + BETTING_PHASE_MS;
    roundResultsDiv.style.display = 'none';
    userBetStatusDiv.textContent = 'Сделайте вашу ставку!';
    updateUI();

    timer = setInterval(() => {
        if (Date.now() >= phaseEndsAt) {
            startRunning();
        } else {
            updateUI();
        }
    }, 100);
}

function startRunning() {
    clearInterval(timer);
    gameState = 'running';
    startTime = Date.now();
    userBetStatusDiv.textContent = bet ? 'Игра идет. Успейте забрать выигрыш!' : 'Игра идет. Ставка в этом раунде не сделана.';
    updateUI();
    timer = setInterval(tick, UPDATE_INTERVAL_MS);
}

function tick() {
    const elapsed = (Date.now() - startTime) / 1000;
    const multiplier = Math.pow(2, elapsed * GROWTH_RATE);

    // Авто-кэшаут срабатывает, если его значение достигнуто раньше краша
    if (bet && bet.cashoutMultiplier === null && bet.autoCashout !== null &&
        bet.autoCashout < crashPoint && multiplier >= bet.autoCashout) {
        cashout(bet.autoCashout);
    }

    if (multiplier >= crashPoint - 0.005) {
        currentMultiplier = crashPoint;
        crash();
        return;
    }

    currentMultiplier = multiplier;
    updateUI();
}

function crash() {
    clearInterval(timer);
    gameState = 'crashed';
    toppleBread();

    roundResultsDiv.style.display = 'block';
    roundCrashPointDiv.textContent = `Крах на ${crashPoint.toFixed(2)}x`;
    addRoundToHistory(crashPoint);

    if (bet) {
        if (bet.cashoutMultiplier !== null) {
            userRoundResultDiv.className = 'alert alert-success text-center';
            userRoundResultDiv.textContent = `Вы забрали выигрыш на ${bet.cashoutMultiplier.toFixed(2)}x. Выигрыш: ${bet.winAmount}₽`;
        } else {
            userRoundResultDiv.className = 'alert alert-danger text-center';
            userRoundResultDiv.textContent = `Вы проиграли ${bet.amount}₽`;
        }
        userRoundResultDiv.style.display = 'block';
    } else {
        userRoundResultDiv.style.display = 'none';
    }

    userBetStatusDiv.textContent = 'Раунд завершен. Следующий раунд скоро начнется.';
    updateUI();
    timer = setTimeout(startBetting, WAIT_BETWEEN_ROUNDS_MS);
}

function cashout(multiplier) {
    if (gameState !== 'running' || !bet || bet.cashoutMultiplier !== null) return;
    const winAmount = Math.floor(bet.amount * multiplier);
    bet.cashoutMultiplier = multiplier;
    bet.winAmount = winAmount;
    const result = Casino.addWin(winAmount, 'crash', { result: `Кэшаут на ${multiplier.toFixed(2)}x` });
    if (result.ok) updateBalance(result.balance);
    userBetStatusDiv.textContent = `Вы успешно забрали выигрыш на ${multiplier.toFixed(2)}x. Выигрыш: ${winAmount}₽`;
    updateUI();
}

// --- Кнопки ---

placeBetButton.addEventListener('click', () => {
    if (gameState !== 'betting') {
        userBetStatusDiv.textContent = 'Сейчас нельзя делать ставки.';
        return;
    }
    if (bet) {
        userBetStatusDiv.textContent = 'Вы уже сделали ставку в этом раунде.';
        return;
    }

    const betAmount = parseInt(betAmountInput.value);
    const autoRaw = autoCashoutInput.value.trim();
    const autoCashout = autoRaw === '' ? null : Math.round(parseFloat(autoRaw) * 100) / 100;

    if (isNaN(betAmount) || betAmount < 1) {
        alert('Введите корректную сумму ставки');
        return;
    }
    if (autoCashout !== null && (isNaN(autoCashout) || autoCashout < 1.01)) {
        alert('Введите корректный авто-кэшаут (минимум 1.01) или оставьте поле пустым');
        return;
    }

    const result = Casino.placeBet(betAmount, 'crash', {
        result: autoCashout !== null ? `Авто-кэшаут ${autoCashout.toFixed(2)}x` : null
    });
    if (!result.ok) {
        alert(result.error);
        return;
    }

    updateBalance(result.balance);
    bet = { amount: betAmount, autoCashout: autoCashout, cashoutMultiplier: null, winAmount: 0 };
    userBetStatusDiv.textContent = 'Ваша ставка принята. Ожидание раунда...';
    updateUI();
});

cashoutButton.addEventListener('click', () => cashout(Math.floor(currentMultiplier * 100) / 100));

window.addEventListener('resize', resizeCanvas);
resizeCanvas();
requestAnimationFrame(sceneLoop);
startBetting();
});
</script>
</body>
</html>
