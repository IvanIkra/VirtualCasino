<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Падение хлеба</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
    .graph-container {
        height: 340px;
        background: radial-gradient(ellipse at 50% 25%, #4a3324 0%, #20150e 55%, #120c08 100%);
    }
    .scene-overlay {
        position: absolute;
        top: 12px;
        left: 50%;
        transform: translateX(-50%);
        text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
        font-size: clamp(1.4rem, 5vw, 2rem);
        white-space: nowrap;
        pointer-events: none;
    }
    .scene-timer {
        position: absolute;
        top: 12px;
        left: 14px;
        min-width: 3.2rem;
        padding: 0.2rem 0.7rem;
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.45);
        color: #fff;
        font-size: 1.4rem;
        font-weight: bold;
        text-align: center;
        pointer-events: none;
    }
    #crash-graph {
        display: block;
        width: 100%;
        height: 100%;
    }
    </style>
</head>
<body class="bg-dark text-light" data-auth="user">
<div class="container mt-4">
    <div id="flash-area"></div>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-10">
                <div class="game-container crash-container card bg-dark text-white p-4">
                    <h2 class="text-center mb-4">🍞 Падение хлеба</h2>

                    <!-- Игровое поле -->
                    <div class="crash-game">
                        <div class="multiplier text-center mb-3">
                            <h3 id="current-multiplier">1.00x</h3>
                            <div id="game-status" class="text-warning fs-5">Ожидание игроков...</div>
                        </div>

                        <div class="graph-container position-relative rounded mb-3 overflow-hidden">
                            <canvas id="crash-graph"></canvas>
                            <div id="betting-timer" class="scene-timer" style="display: none;"></div>
                            <div id="crash-label" class="scene-overlay text-danger fw-bold" style="display: none;">ХЛЕБ УПАЛ!</div>
                        </div>

                        <div class="history mb-3">
                            <h5>История раундов:</h5>
                            <div id="round-history" class="d-flex flex-wrap justify-content-center"></div>
                        </div>
                    </div>

                    <!-- Панель управления -->
                    <div class="control-panel mt-4 card bg-secondary text-white p-3">
                        <div class="row align-items-center">
                            <div class="col-md-4">
                                <div class="form-group mb-2">
                                    <label for="bet-amount" class="form-label">Сумма ставки</label>
                                    <input type="number" class="form-control bg-dark text-white border-secondary" id="bet-amount" min="1" value="10">
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="form-group mb-2">
                                    <label for="auto-cashout" class="form-label">Авто-кэшаут (x), можно оставить пустым</label>
                                    <input type="number" class="form-control bg-dark text-white border-secondary" id="auto-cashout" min="1.01" value="2.00" step="0.01">
                                </div>
                            </div>
                            <div class="col-md-4">
                                <button class="btn btn-primary w-100 mb-2" id="place-bet-button">Сделать ставку</button>
                                <button class="btn btn-danger w-100 mb-2" id="cashout-button" style="display: none;">Забрать выигрыш</button>
                            </div>
                        </div>
                        <div id="user-bet-status" class="mt-2 text-center"></div>
                    </div>

                    <!-- Результаты -->
                    <div class="results mt-4" id="round-results" style="display: none;">
                        <h5>Результаты раунда:</h5>
                        <div id="round-crash-point" class="alert alert-danger text-center"></div>
                        <div id="user-round-result" class="alert text-center"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/store.js"></script>
<script src="js/layout.js"></script>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js';

Casino.ready(() => {
// Параметры раунда (как в games/crash.py)
const BETTING_PHASE_MS = 10000;
const WAIT_BETWEEN_ROUNDS_MS = 5000;
const UPDATE_INTERVAL_MS = 50;
const GROWTH_RATE = 0.1; // множитель = 2^(секунды * GROWTH_RATE)

const multiplierElement = document.getElementById('current-multiplier');
const gameStatusElement = document.getElementById('game-status');
const graphContainer = document.querySelector('.graph-container');
const canvas = document.getElementById('crash-graph');
const betAmountInput = document.getElementById('bet-amount');
const autoCashoutInput = document.getElementById('auto-cashout');
const placeBetButton = document.getElementById('place-bet-button');
const cashoutButton = document.getElementById('cashout-button');
const roundResultsDiv = document.getElementById('round-results');
const roundCrashPointDiv = document.getElementById('round-crash-point');
const userRoundResultDiv = document.getElementById('user-round-result');
const roundHistoryDiv = document.getElementById('round-history');
const bettingTimerDiv = document.getElementById('betting-timer');
const userBetStatusDiv = document.getElementById('user-bet-status');

let gameState = 'waiting'; // waiting, betting, running, crashed
let crashPoint = null;
let currentMultiplier = 1.0;
let phaseEndsAt = 0;
let startTime = 0;
let timer = null;
let bet = null; // { amount, autoCashout, cashoutMultiplier, winAmount }

// Генерирует точку краша так, что P(crash <= x) ≈ 1 - 1/x
function calculateCrashPoint() {
    while (true) {
        const randomValue = 0.05 + Math.random() * 0.95;
        const crash = 1 / (1 - randomValue);
        if (crash >= 1.01) {
            return Math.round(Math.min(crash, 200.0) * 100) / 100;
        }
    }
}

// --- 3D-сцена: ломтик хлеба стоит на ребре, качается и падает плашмя ---

const FALL_ACCELERATION = 10; // рад/с² — как быстро хлеб заваливается
const SLICE_H = 2.0;          // размеры ломтика в единицах сцены
const SLICE_W = 1.44;
const SLICE_T = 0.24;
const BEVEL = 0.07;
const EDGE_Z = SLICE_T / 2 + BEVEL; // ребро, на котором ломтик стоит и вокруг которого падает
const GRAVITY = 9.8;
const BREAD_Z = -0.7;  // хлеб стоит чуть дальше центра, чтобы упавший вперед ломтик помещался в кадр

let tilt = 0;          // наклон вокруг нижнего ребра, рад; > 0 — вперед на зрителя, < 0 — назад
let wobblePhase = 0;
let fall = null;       // { dir, velocity, bounced, settled }
let crumbs = [];
let shake = 0;
let lastFrameTime = performance.now();
const crashLabel = document.getElementById('crash-label');

// Контур ломтика (y вверх): подходит и для THREE.Shape, и для 2D-контекста холста
function traceSlice(path, w, h) {
    const r = w * 0.08;
    path.moveTo(-w / 2 + r, 0);
    path.lineTo(w / 2 - r, 0);
    path.quadraticCurveTo(w / 2, 0, w / 2, r);
    path.lineTo(w / 2, 0.58 * h);
    path.bezierCurveTo(w / 2 + 0.16 * w, 0.62 * h, w / 2 + 0.18 * w, 0.93 * h, 0.22 * w, 0.98 * h);
    path.bezierCurveTo(0.08 * w, 1.02 * h, -0.08 * w, 1.02 * h, -0.22 * w, 0.98 * h);
    path.bezierCurveTo(-w / 2 - 0.18 * w, 0.93 * h, -w / 2 - 0.16 * w, 0.62 * h, -w / 2, 0.58 * h);
    path.lineTo(-w / 2, r);
    path.quadraticCurveTo(-w / 2, 0, -w / 2 + r, 0);
}

// Свой генератор случайных чисел для текстур, чтобы хлеб и стол всегда выглядели одинаково
function makeRandom(seed) {
    return () => {
        seed = (seed + 0x6D2B79F5) | 0;
        let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
}

// Текстура среза: корочка по краю, мякиш с порами. Координаты холста совпадают с координатами контура
const FACE_X = SLICE_W * 0.7;
const FACE_Y = SLICE_H * 1.05;

function makeFaceTextures() {
    const rand = makeRandom(11);
    const width = 512;
    const height = Math.round(width * FACE_Y / (2 * FACE_X));
    const color = document.createElement('canvas');
    const bump = document.createElement('canvas');
    color.width = bump.width = width;
    color.height = bump.height = height;
    const c = color.getContext('2d');
    const b = bump.getContext('2d');
    const toCanvas = context => context.setTransform(width / (2 * FACE_X), 0, 0, -height / FACE_Y, width / 2, height);

    // Корочка
    toCanvas(c);
    c.beginPath();
    traceSlice(c, SLICE_W, SLICE_H);
    c.fillStyle = '#a5621f';
    c.fill();

    // Мякиш — уменьшенный контур, с мягким переходом к корке
    const inner = context => {
        context.translate(0, SLICE_H * 0.5);
        context.scale(0.87, 0.89);
        context.translate(0, -SLICE_H * 0.5);
        context.beginPath();
        traceSlice(context, SLICE_W, SLICE_H);
    };
    c.save();
    inner(c);
    c.shadowColor = 'rgba(120, 60, 10, 0.9)';
    c.shadowBlur = 14;
    const gradient = c.createRadialGradient(0, SLICE_H * 0.55, 0.1, 0, SLICE_H * 0.5, SLICE_H * 0.7);
    gradient.addColorStop(0, '#fbe9c4');
    gradient.addColorStop(1, '#efd29a');
    c.fillStyle = gradient;
    c.fill();
    c.restore();

    b.fillStyle = '#808080';
    b.fillRect(0, 0, width, height);

    // Поры: темные впадины на цвете и на карте рельефа
    c.save();
    inner(c);
    c.clip();
    c.setTransform(1, 0, 0, 1, 0, 0);
    for (let i = 0; i < 1400; i++) {
        const x = rand() * width;
        const y = rand() * height;
        const rx = 0.8 + rand() * rand() * 6;
        const ry = rx * (0.5 + rand() * 0.6);
        const angle = rand() * Math.PI;
        const light = rand() < 0.25;
        c.fillStyle = light
            ? `rgba(255, 246, 225, ${0.35 + rand() * 0.4})`
            : `rgba(${160 + rand() * 30}, ${108 + rand() * 25}, ${52 + rand() * 20}, ${0.35 + rand() * 0.45})`;
        c.beginPath();
        c.ellipse(x, y, rx, ry, angle, 0, Math.PI * 2);
        c.fill();
        if (light) continue;
        b.fillStyle = `rgba(20, 20, 20, ${0.4 + rand() * 0.5})`;
        b.beginPath();
        b.ellipse(x, y, rx, ry, angle, 0, Math.PI * 2);
        b.fill();
    }
    c.restore();

    const textures = [color, bump].map(source => {
        const texture = new THREE.CanvasTexture(source);
        // UV торцов ExtrudeGeometry — это координаты контура; переводим их в 0..1
        texture.repeat.set(1 / (2 * FACE_X), 1 / FACE_Y);
        texture.offset.set(0.5, 0);
        texture.anisotropy = 4;
        return texture;
    });
    textures[0].colorSpace = THREE.SRGBColorSpace;
    return textures;
}

// Доски идут от зрителя вглубь (вдоль оси z), волокна — вдоль досок
function makeWoodTexture() {
    const rand = makeRandom(5);
    const source = document.createElement('canvas');
    source.width = 1024;
    source.height = 1024;
    const c = source.getContext('2d');
    const planks = 6;
    const plankWidth = source.width / planks;
    for (let p = 0; p < planks; p++) {
        const x0 = p * plankWidth;
        const base = 92 + rand() * 30;
        c.fillStyle = `rgb(${base}, ${base * 0.6}, ${base * 0.34})`;
        c.fillRect(x0, 0, plankWidth, source.height);
        for (let i = 0; i < 60; i++) {
            const x = x0 + rand() * plankWidth;
            const dark = rand() < 0.6;
            c.strokeStyle = dark
                ? `rgba(40, 20, 8, ${0.05 + rand() * 0.12})`
                : `rgba(255, 210, 160, ${0.03 + rand() * 0.06})`;
            c.lineWidth = 0.5 + rand() * 2.5;
            const wave = 2 + rand() * 4;
            const phase = rand() * 10;
            c.beginPath();
            for (let y = 0; y <= source.height; y += 32) {
                const xx = x + Math.sin(y / 120 + phase) * wave;
                if (y === 0) c.moveTo(xx, y); else c.lineTo(xx, y);
            }
            c.stroke();
        }
        // Сучок
        if (rand() < 0.6) {
            const kx = x0 + plankWidth * (0.3 + rand() * 0.4);
            const ky = rand() * source.height;
            for (let r = 18; r > 2; r -= 4) {
                c.strokeStyle = `rgba(50, 25, 10, ${0.12 + (18 - r) * 0.02})`;
                c.lineWidth = 2;
                c.beginPath();
                c.ellipse(kx, ky, r * 0.6, r * 1.6, 0, 0, Math.PI * 2);
                c.stroke();
            }
        }
        // Щель между досками
        c.fillStyle = 'rgba(25, 12, 5, 0.85)';
        c.fillRect(x0, 0, 3, source.height);
    }
    const texture = new THREE.CanvasTexture(source);
    texture.colorSpace = THREE.SRGBColorSpace;
    texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
    texture.repeat.set(2.5, 1.25);
    texture.anisotropy = 8;
    return texture;
}

let renderer = null;
let scene, camera, pivot, bread;
const crumbGeometry = new THREE.DodecahedronGeometry(1, 0);
const crumbMaterials = [
    new THREE.MeshStandardMaterial({ color: 0x9c5a1c, roughness: 0.9 }),
    new THREE.MeshStandardMaterial({ color: 0xf1d7a2, roughness: 0.95 })
];

function buildScene() {
    try {
        renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    } catch (e) {
        graphContainer.insertAdjacentHTML('beforeend',
            '<div class="position-absolute top-50 start-50 translate-middle text-center">Браузер не поддерживает WebGL — анимация хлеба недоступна</div>');
        return;
    }
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;

    scene = new THREE.Scene();
    scene.fog = new THREE.Fog(0x140d08, 9, 17);
    camera = new THREE.PerspectiveCamera(30, 2, 0.1, 50);

    scene.add(new THREE.HemisphereLight(0xfff0d8, 0x4a2e18, 1.0));
    const sun = new THREE.DirectionalLight(0xffe0b0, 2.4);
    sun.position.set(3, 6, 4);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    Object.assign(sun.shadow.camera, { left: -4, right: 4, top: 4, bottom: -4, near: 1, far: 20 });
    sun.shadow.bias = -0.0004;
    sun.shadow.radius = 5;
    scene.add(sun);
    const fill = new THREE.DirectionalLight(0xfff4e6, 0.9);
    fill.position.set(0, 2, 8);
    scene.add(fill);
    const rim = new THREE.DirectionalLight(0x9db8ff, 0.7);
    rim.position.set(-4, 3, -5);
    scene.add(rim);

    const table = new THREE.Mesh(
        new THREE.BoxGeometry(16, 0.4, 8),
        new THREE.MeshStandardMaterial({ map: makeWoodTexture(), roughness: 0.65, metalness: 0.05 })
    );
    table.position.set(0, -0.2, 0.5);
    table.receiveShadow = true;
    scene.add(table);

    const shape = new THREE.Shape();
    traceSlice(shape, SLICE_W, SLICE_H);
    const geometry = new THREE.ExtrudeGeometry(shape, {
        depth: SLICE_T,
        bevelEnabled: true,
        bevelThickness: BEVEL,
        bevelSize: BEVEL * 0.8,
        bevelSegments: 5,
        curveSegments: 40
    });
    geometry.translate(0, BEVEL * 0.8, -SLICE_T / 2);

    const [faceMap, faceBump] = makeFaceTextures();
    const faceMaterial = new THREE.MeshStandardMaterial({ map: faceMap, bumpMap: faceBump, bumpScale: 3, roughness: 0.92 });
    const crustMaterial = new THREE.MeshStandardMaterial({ color: 0x9a561a, roughness: 0.6, bumpMap: faceBump, bumpScale: 1 });
    bread = new THREE.Mesh(geometry, [faceMaterial, crustMaterial]);
    bread.castShadow = true;
    bread.receiveShadow = true;

    pivot = new THREE.Group();
    pivot.add(bread);
    scene.add(pivot);

    resizeCanvas();
}

function resizeCanvas() {
    if (!renderer) return;
    const width = graphContainer.clientWidth;
    const height = graphContainer.clientHeight;
    renderer.setSize(width, height, false);
    camera.aspect = width / height;
    // На узком экране отодвигаем камеру, чтобы хлеб помещался и стоя, и лежа
    const distance = 7 * Math.min(Math.max(1.5 / camera.aspect, 1), 1.9);
    camera.userData.base = new THREE.Vector3(0, distance * 0.36, distance);
    camera.updateProjectionMatrix();
}

function placeBread() {
    // Ломтик вращается вокруг того ребра, на которое заваливается
    const edge = tilt >= 0 ? EDGE_Z : -EDGE_Z;
    pivot.position.set(0, 0, BREAD_Z + edge);
    bread.position.set(0, 0, -edge);
    pivot.rotation.x = tilt;
}

function spawnCrumbs() {
    const top = bread.localToWorld(new THREE.Vector3(0, SLICE_H * 0.9, 0));
    for (let i = 0; i < 26; i++) {
        const size = 0.02 + Math.random() * 0.04;
        const mesh = new THREE.Mesh(crumbGeometry, crumbMaterials[i % 2]);
        mesh.scale.setScalar(size);
        mesh.castShadow = true;
        mesh.position.set(top.x + (Math.random() - 0.5) * 0.8, size, top.z + (Math.random() - 0.5) * 0.3);
        mesh.userData = {
            velocity: new THREE.Vector3((Math.random() - 0.5) * 3, 1 + Math.random() * 2.5, (Math.random() - 0.5) * 2),
            spin: new THREE.Vector3(Math.random() * 10, Math.random() * 10, Math.random() * 10),
            size: size
        };
        scene.add(mesh);
        crumbs.push(mesh);
    }
}

function updateScene(dt) {
    if (gameState === 'running') {
        // Чем выше множитель, тем сильнее и чаще качается хлеб
        const growth = Math.log(Math.max(currentMultiplier, 1));
        const amplitude = Math.min(0.035 + growth * 0.15, 0.42);
        const speed = 2.5 + growth * 2.2;
        wobblePhase += speed * dt;
        tilt = amplitude * Math.sin(wobblePhase) + 0.01 * Math.sin(Date.now() / 37);
    } else if (gameState === 'crashed' && fall && !fall.settled) {
        fall.velocity += fall.dir * FALL_ACCELERATION * dt;
        tilt += fall.velocity * dt;
        if (fall.dir * tilt >= Math.PI / 2) {
            tilt = fall.dir * Math.PI / 2;
            if (!fall.bounced) {
                fall.bounced = true;
                fall.velocity = -fall.velocity * 0.22;
                placeBread();
                spawnCrumbs();
                shake = 0.08;
            } else {
                fall.settled = true;
                fall.velocity = 0;
            }
        }
    } else if (gameState === 'betting' || gameState === 'waiting') {
        tilt = 0;
    }

    crumbs.forEach(mesh => {
        const data = mesh.userData;
        data.velocity.y -= GRAVITY * dt;
        mesh.position.addScaledVector(data.velocity, dt);
        if (mesh.position.y < data.size) {
            mesh.position.y = data.size;
            data.velocity.set(data.velocity.x * 0.6, Math.abs(data.velocity.y) * 0.25, data.velocity.z * 0.6);
            data.spin.multiplyScalar(0.5);
        }
        mesh.rotation.x += data.spin.x * dt;
        mesh.rotation.y += data.spin.y * dt;
        mesh.rotation.z += data.spin.z * dt;
    });

    shake *= Math.exp(-dt * 7);
}

function sceneLoop(now) {
    const dt = Math.min((now - lastFrameTime) / 1000, 0.05);
    lastFrameTime = now;
    updateScene(dt);
    crashLabel.style.display = gameState === 'crashed' ? 'block' : 'none';
    placeBread();
    camera.position.copy(camera.userData.base);
    camera.position.x += (Math.random() - 0.5) * shake;
    camera.position.y += (Math.random() - 0.5) * shake;
    camera.lookAt(0, 0.9, 0);
    renderer.render(scene, camera);
    requestAnimationFrame(sceneLoop);
}

// Хлеб заваливается в ту сторону, куда уже наклонился
function toppleBread() {
    const dir = Math.abs(tilt) > 0.01 ? Math.sign(tilt) : (Math.random() < 0.5 ? -1 : 1);
    fall = { dir: dir, velocity: dir * 0.8, bounced: false, settled: false };
}

// Новый раунд: хлеб снова стоит, куда он качнется первым — случайно
function resetBread() {
    fall = null;
    tilt = 0;
    wobblePhase = Math.random() < 0.5 ? 0 : Math.PI;
    crumbs.forEach(mesh => scene && scene.remove(mesh));
    crumbs = [];
}

function updateUI() {
    const now = Date.now();
    const secondsLeft = Math.max(0, (phaseEndsAt - now) / 1000);

    gameStatusElement.textContent = {
        'waiting': 'Ожидание следующего раунда...',
        'betting': `Ставки: ${secondsLeft.toFixed(1)} сек`,
        'running': 'Игра идет...',
        'crashed': `Крах на ${crashPoint !== null ? crashPoint.toFixed(2) : '--'}x`
    }[gameState];

    multiplierElement.textContent = currentMultiplier.toFixed(2) + 'x';

    bettingTimerDiv.style.display = gameState === 'betting' ? 'block' : 'none';
    bettingTimerDiv.textContent = `⏱ ${Math.ceil(secondsLeft)}`;

    const hasActiveBet = bet !== null && bet.cashoutMultiplier === null;
    placeBetButton.style.display = gameState === 'running' ? 'none' : 'block';
    placeBetButton.disabled = gameState !== 'betting' || bet !== null;
    cashoutButton.style.display = gameState === 'running' && hasActiveBet ? 'block' : 'none';
}

function addRoundToHistory(point) {
    const span = document.createElement('span');
    span.className = 'badge me-1 mb-1';
    span.textContent = `${point.toFixed(2)}x`;
    if (point < 2.00) {
        span.classList.add('bg-danger');
    } else if (point < 10.00) {
        span.classList.add('bg-warning');
    } else {
        span.classList.add('bg-success');
    }
    roundHistoryDiv.prepend(span);
    while (roundHistoryDiv.children.length > 20) {
        roundHistoryDiv.removeChild(roundHistoryDiv.lastChild);
    }
}

// --- Игровой цикл ---

function startBetting() {
    clearInterval(timer);
    gameState = 'betting';
    crashPoint = calculateCrashPoint();
    currentMultiplier = 1.0;
    bet = null;
    resetBread();
    phaseEndsAt = Date.now() + BETTING_PHASE_MS;
    roundResultsDiv.style.display = 'none';
    userBetStatusDiv.textContent = 'Сделайте вашу ставку!';
    updateUI();

    timer = setInterval(() => {
        if (Date.now() >= phaseEndsAt) {
            startRunning();
        } else {
            updateUI();
        }
    }, 100);
}

function startRunning() {
    clearInterval(timer);
    gameState = 'running';
    startTime = Date.now();
    userBetStatusDiv.textContent = bet ? 'Игра идет. Успейте забрать выигрыш!' : 'Игра идет. Ставка в этом раунде не сделана.';
    updateUI();
    timer = setInterval(tick, UPDATE_INTERVAL_MS);
}

function tick() {
    const elapsed = (Date.now() - startTime) / 1000;
    const multiplier = Math.pow(2, elapsed * GROWTH_RATE);

    // Авто-кэшаут срабатывает, если его значение достигнуто раньше краша
    if (bet && bet.cashoutMultiplier === null && bet.autoCashout !== null &&
        bet.autoCashout < crashPoint && multiplier >= bet.autoCashout) {
        cashout(bet.autoCashout);
    }

    if (multiplier >= crashPoint - 0.005) {
        currentMultiplier = crashPoint;
        crash();
        return;
    }

    currentMultiplier = multiplier;
    updateUI();
}

function crash() {
    clearInterval(timer);
    gameState = 'crashed';
    toppleBread();

    roundResultsDiv.style.display = 'block';
    roundCrashPointDiv.textContent = `Крах на ${crashPoint.toFixed(2)}x`;
    addRoundToHistory(crashPoint);

    if (bet) {
        if (bet.cashoutMultiplier !== null) {
            userRoundResultDiv.className = 'alert alert-success text-center';
            userRoundResultDiv.textContent = `Вы забрали выигрыш на ${bet.cashoutMultiplier.toFixed(2)}x. Выигрыш: ${bet.winAmount}₽`;
        } else {
            userRoundResultDiv.className = 'alert alert-danger text-center';
            userRoundResultDiv.textContent = `Вы проиграли ${bet.amount}₽`;
        }
        userRoundResultDiv.style.display = 'block';
    } else {
        userRoundResultDiv.style.display = 'none';
    }

    userBetStatusDiv.textContent = 'Раунд завершен. Следующий раунд скоро начнется.';
    updateUI();
    timer = setTimeout(startBetting, WAIT_BETWEEN_ROUNDS_MS);
}

function cashout(multiplier) {
    if (gameState !== 'running' || !bet || bet.cashoutMultiplier !== null) return;
    const winAmount = Math.floor(bet.amount * multiplier);
    bet.cashoutMultiplier = multiplier;
    bet.winAmount = winAmount;
    const result = Casino.addWin(winAmount, 'crash', { result: `Кэшаут на ${multiplier.toFixed(2)}x` });
    if (result.ok) updateBalance(result.balance);
    userBetStatusDiv.textContent = `Вы успешно забрали выигрыш на ${multiplier.toFixed(2)}x. Выигрыш: ${winAmount}₽`;
    updateUI();
}

// --- Кнопки ---

placeBetButton.addEventListener('click', () => {
    if (gameState !== 'betting') {
        userBetStatusDiv.textContent = 'Сейчас нельзя делать ставки.';
        return;
    }
    if (bet) {
        userBetStatusDiv.textContent = 'Вы уже сделали ставку в этом раунде.';
        return;
    }

    const betAmount = parseInt(betAmountInput.value);
    const autoRaw = autoCashoutInput.value.trim();
    const autoCashout = autoRaw === '' ? null : Math.round(parseFloat(autoRaw) * 100) / 100;

    if (isNaN(betAmount) || betAmount < 1) {
        alert('Введите корректную сумму ставки');
        return;
    }
    if (autoCashout !== null && (isNaN(autoCashout) || autoCashout < 1.01)) {
        alert('Введите корректный авто-кэшаут (минимум 1.01) или оставьте поле пустым');
        return;
    }

    const result = Casino.placeBet(betAmount, 'crash', {
        result: autoCashout !== null ? `Авто-кэшаут ${autoCashout.toFixed(2)}x` : null
    });
    if (!result.ok) {
        alert(result.error);
        return;
    }

    updateBalance(result.balance);
    bet = { amount: betAmount, autoCashout: autoCashout, cashoutMultiplier: null, winAmount: 0 };
    userBetStatusDiv.textContent = 'Ваша ставка принята. Ожидание раунда...';
    updateUI();
});

cashoutButton.addEventListener('click', () => cashout(Math.floor(currentMultiplier * 100) / 100));

buildScene();
window.addEventListener('resize', resizeCanvas);
if (renderer) requestAnimationFrame(sceneLoop);
startBetting();
});
</script>
