<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ панель</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-dark text-light" data-auth="admin">
<div class="container mt-4">
    <div id="flash-area"></div>
    <h2 class="text-light mb-4">Панель администратора</h2>
    <p class="text-secondary">Изменения действуют только в этом браузере.</p>

    <div class="row mb-4">
        <div class="col">
            <a href="admin-users.html" class="btn btn-primary">Управление пользователями</a>
        </div>
    </div>

    <h3 class="text-light mb-3">Конфигурация игр</h3>
    <div class="table-responsive">
        <table class="table table-dark table-striped">
            <thead>
                <tr>
                    <th class="text-light">Игра</th>
                    <th class="text-light">Действия</th>
                </tr>
            </thead>
            <tbody id="configs-body"></tbody>
        </table>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/store.js"></script>
<script src="js/layout.js"></script>
<script>
Casino.ready(() => {
    const tbody = document.getElementById('configs-body');
    Object.keys(Casino.getConfigs()).forEach(gameType => {
        const row = document.createElement('tr');
        row.innerHTML = `
            <td class="text-light">${escapeHtml(gameType)}</td>
            <td><a href="admin-config.html?game=${encodeURIComponent(gameType)}" class="btn btn-primary btn-sm">Редактировать</a></td>`;
        tbody.appendChild(row);
    });
});
</script>
</body>
</html>
