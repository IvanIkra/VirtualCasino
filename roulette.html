<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Рулетка</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
    .roulette-wheel {
        width: 100%;
        max-width: 620px;
        aspect-ratio: 1;
        margin: 0 auto;
        position: relative;
    }

    .wheel {
        width: 100%;
        height: 100%;
        display: block;
        transform-origin: 50% 50%;
        will-change: transform;
        background: none;
        border: none;
    }

    .wheel text {
        font-family: Arial, sans-serif;
        font-weight: bold;
        font-size: 15px;
        fill: #fff;
        text-anchor: middle;
        dominant-baseline: central;
        user-select: none;
    }

    .indicator-arrow {
        position: absolute;
        top: -4px;
        left: 50%;
        transform: translateX(-50%);
        width: 0;
        height: 0;
        border-left: 14px solid transparent;
        border-right: 14px solid transparent;
        border-top: 28px solid #ffd54a;
        filter: drop-shadow(0 2px 3px rgba(0,0,0,0.6));
        z-index: 2;
    }

    /* Стили для панели ставок */
    .betting-panel {
        height: 100%;
        box-shadow: 0 0 20px rgba(0,0,0,0.3);
        background: #1a1a1a !important;
    }

    .form-control:focus {
        background-color: #2c2c2c !important;
        border-color: #6c757d !important;
        color: #fff !important;
        box-shadow: none;
    }

    .btn-play {
        background: #33c0b2;
        border: none;
        color: white;
        font-weight: bold;
        padding: 12px;
        transition: all 0.3s ease;
    }

    .btn-play:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        background: #2a9d92;
        color: white;
    }

    .alert {
        border: none;
        border-radius: 8px;
        margin-bottom: 1rem;
    }

    .alert-info {
        background-color: rgba(23, 162, 184, 0.2);
        color: #17a2b8;
    }

    .alert-success {
        background-color: rgba(40, 167, 69, 0.2);
        color: #28a745;
    }

    .alert-danger {
        background-color: rgba(220, 53, 69, 0.2);
        color: #dc3545;
    }
    </style>
</head>
<body class="bg-dark text-light" data-auth="user">
<div class="container mt-4">
    <div id="flash-area"></div>
    <div class="container-fluid mt-4">
        <div class="row">
            <!-- Колесо рулетки -->
            <div class="col-md-8">
                <div class="game-container">
                    <h2 class="text-center mb-4">🎡 Рулетка</h2>
                    <div class="roulette-wheel">
                        <svg class="wheel" id="wheel" viewBox="0 0 400 400" role="img" aria-label="Колесо рулетки"></svg>
                        <div class="indicator-arrow"></div>
                    </div>
                </div>
            </div>

            <!-- Панель ставок -->
            <div class="col-md-4">
                <div class="betting-panel p-4 bg-dark rounded">
                    <h3 class="text-light mb-4">Сделать ставку</h3>

                    <!-- Сумма ставки -->
                    <div class="form-group mb-4">
                        <label for="bet-amount" class="text-light">Сумма ставки</label>
                        <div class="input-group">
                            <input type="number" class="form-control bg-dark text-light border-secondary"
                                   id="bet-amount" min="1" value="10">
                            <span class="input-group-text bg-dark text-light border-secondary">₽</span>
                        </div>
                    </div>

                    <!-- Тип ставки -->
                    <div class="form-group mb-4">
                        <label for="bet-type" class="text-light">Тип ставки</label>
                        <select class="form-control bg-dark text-light border-secondary" id="bet-type">
                            <option value="red">На красное (x2)</option>
                            <option value="black">На черное (x2)</option>
                            <option value="even">На четное (x2)</option>
                            <option value="odd">На нечетное (x2)</option>
                            <option value="number">На число (x35)</option>
                        </select>
                    </div>

                    <!-- Значение ставки -->
                    <div class="form-group mb-4" id="bet-value-container" style="display: none;">
                        <label for="bet-value" class="text-light">Значение</label>
                        <input type="number" class="form-control bg-dark text-light border-secondary"
                               id="bet-value" min="0" max="36" placeholder="Введите число (0-36)">
                    </div>

                    <!-- Кнопка ставки -->
                    <button class="btn btn-play w-100 mb-4" id="spin-button">
                        <i class="fas fa-dice"></i> Крутить
                    </button>

                    <!-- Результаты -->
                    <div class="results" id="results" style="display: none;">
                        <div class="result-number"></div>
                        <div class="win-amount"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/store.js"></script>
<script src="js/layout.js"></script>
<script>
Casino.ready(() => {
// Порядок чисел на европейском колесе по часовой стрелке, начиная с зеро
const WHEEL_ORDER = [0, 32, 15, 19, 4, 21, 2, 25, 17, 34, 6, 27, 13, 36, 11, 30, 8, 23, 10, 5,
                     24, 16, 33, 1, 20, 14, 31, 9, 22, 18, 29, 7, 28, 12, 35, 3, 26];
const SECTOR_COUNT = WHEEL_ORDER.length;
const SECTOR_ANGLE = 360 / SECTOR_COUNT;
const RED_NUMBERS = [1, 3, 5, 7, 9, 12, 14, 16, 18, 19, 21, 23, 25, 27, 30, 32, 34, 36];
const COLOR_NAMES = { green: 'зеленый', red: 'красный', black: 'черный' };
const SECTOR_FILL = { green: '#1e8f3a', red: '#c62828', black: '#1b1b1b' };
const SPIN_DURATION_MS = 6000;
const EXTRA_SPINS = 6;

let isSpinning = false;
let currentRotation = 0;

function colorOf(number) {
    if (number === 0) return 'green';
    return RED_NUMBERS.includes(number) ? 'red' : 'black';
}

// --- Отрисовка колеса (SVG 400x400, центр 200,200) ---

const SVG_NS = 'http://www.w3.org/2000/svg';
const wheel = document.getElementById('wheel');

function svg(tag, attrs) {
    const el = document.createElementNS(SVG_NS, tag);
    Object.entries(attrs).forEach(([key, value]) => el.setAttribute(key, value));
    return el;
}

// Точка на окружности; угол отсчитывается от верха по часовой стрелке
function polar(radius, angleDeg) {
    const rad = (angleDeg - 90) * Math.PI / 180;
    return [200 + radius * Math.cos(rad), 200 + radius * Math.sin(rad)];
}

function sectorPath(innerR, outerR, startDeg, endDeg) {
    const [x1, y1] = polar(outerR, startDeg);
    const [x2, y2] = polar(outerR, endDeg);
    const [x3, y3] = polar(innerR, endDeg);
    const [x4, y4] = polar(innerR, startDeg);
    return `M ${x1} ${y1} A ${outerR} ${outerR} 0 0 1 ${x2} ${y2} L ${x3} ${y3} A ${innerR} ${innerR} 0 0 0 ${x4} ${y4} Z`;
}

function buildWheel() {
    wheel.appendChild(svg('circle', { cx: 200, cy: 200, r: 198, fill: '#6b4a2b' }));
    wheel.appendChild(svg('circle', { cx: 200, cy: 200, r: 188, fill: '#d4af37' }));

    WHEEL_ORDER.forEach((number, index) => {
        const center = index * SECTOR_ANGLE;
        wheel.appendChild(svg('path', {
            d: sectorPath(120, 184, center - SECTOR_ANGLE / 2, center + SECTOR_ANGLE / 2),
            fill: SECTOR_FILL[colorOf(number)],
            stroke: '#d4af37',
            'stroke-width': 1
        }));
        const [x, y] = polar(164, center);
        const text = svg('text', { x: x, y: y, transform: `rotate(${center} ${x} ${y})`, 'data-number': number });
        text.textContent = number;
        wheel.appendChild(text);
    });

    // Внутренняя часть колеса
    wheel.appendChild(svg('circle', { cx: 200, cy: 200, r: 120, fill: '#3b2a1a', stroke: '#d4af37', 'stroke-width': 3 }));
    wheel.appendChild(svg('circle', { cx: 200, cy: 200, r: 95, fill: '#2a1d12' }));
    for (let i = 0; i < 2; i++) {
        const [x1, y1] = polar(90, i * 90);
        const [x2, y2] = polar(90, i * 90 + 180);
        wheel.appendChild(svg('line', { x1, y1, x2, y2, stroke: '#d4af37', 'stroke-width': 6, 'stroke-linecap': 'round' }));
    }
    wheel.appendChild(svg('circle', { cx: 200, cy: 200, r: 22, fill: '#d4af37' }));
    wheel.appendChild(svg('circle', { cx: 200, cy: 200, r: 10, fill: '#f5e08a' }));
}

buildWheel();

// --- Игровая логика (перенесена из games/roulette.py) ---

function playRoulette(betType, betAmount, betValue) {
    let betNumber = null;
    if (betType === 'number') {
        const raw = String(betValue).trim();
        betNumber = Number(raw);
        if (raw === '' || !Number.isInteger(betNumber)) {
            return { error: 'Неверное значение для ставки на число' };
        }
        if (betNumber < 0 || betNumber > 36) {
            return { error: 'Неверное число для ставки (допустимо 0-36)' };
        }
    } else if (!['red', 'black', 'even', 'odd'].includes(betType)) {
        return { error: 'Неверный тип ставки' };
    }

    const bet = Casino.placeBet(betAmount, 'roulette', {
        bet_type: betType,
        bet_value: betNumber !== null ? String(betNumber) : null
    });
    if (!bet.ok) return { error: bet.error };

    const result = Math.floor(Math.random() * SECTOR_COUNT);
    const color = colorOf(result);
    let winAmount = 0;

    if (betType === 'number') {
        if (betNumber === result) winAmount = betAmount * 35;
    } else if (betType === 'red' || betType === 'black') {
        if (betType === color) winAmount = betAmount * 2;
    } else if (betType === 'even') {
        if (result !== 0 && result % 2 === 0) winAmount = betAmount * 2;
    } else if (betType === 'odd') {
        if (result % 2 === 1) winAmount = betAmount * 2;
    }

    let balance = bet.balance;
    if (winAmount > 0) {
        balance = Casino.addWin(winAmount, 'roulette', {
            bet_type: betType,
            bet_value: betNumber !== null ? String(betNumber) : null,
            result: `Выпало ${result} (${COLOR_NAMES[color]})`
        }).balance;
    }

    return { result, color, win: winAmount > 0, win_amount: winAmount, balance };
}

function updateBetValue() {
    const isNumber = document.getElementById('bet-type').value === 'number';
    document.getElementById('bet-value-container').style.display = isNumber ? 'block' : 'none';
}

function spin() {
    if (isSpinning) return;

    const betAmount = parseInt(document.getElementById('bet-amount').value);
    const betType = document.getElementById('bet-type').value;
    const betValue = document.getElementById('bet-value').value;

    if (isNaN(betAmount) || betAmount <= 0) {
        alert('Введите корректную сумму ставки');
        return;
    }

    const data = playRoulette(betType, betAmount, betValue);
    if (data.error) {
        alert(data.error);
        return;
    }

    isSpinning = true;
    document.getElementById('results').style.display = 'none';

    // Поворачиваем колесо так, чтобы выпавший сектор оказался под стрелкой
    // Небольшой случайный сдвиг внутри сектора, чтобы колесо не останавливалось всегда ровно по центру
    const jitter = (Math.random() - 0.5) * SECTOR_ANGLE * 0.6;
    const targetAngle = (((360 - WHEEL_ORDER.indexOf(data.result) * SECTOR_ANGLE + jitter) % 360) + 360) % 360;
    const normalizedCurrent = ((currentRotation % 360) + 360) % 360;
    let angleDifference = targetAngle - normalizedCurrent;
    if (angleDifference < 0) angleDifference += 360;
    currentRotation += EXTRA_SPINS * 360 + angleDifference;

    wheel.style.transition = `transform ${SPIN_DURATION_MS}ms cubic-bezier(0.15, 0.65, 0.1, 1)`;
    wheel.style.transform = `rotate(${currentRotation}deg)`;

    setTimeout(() => {
        const results = document.getElementById('results');
        const resultNumber = results.querySelector('.result-number');
        const winAmount = results.querySelector('.win-amount');
        results.style.display = 'block';

        const colorText = { green: 'зеленое', red: 'красное', black: 'черное' }[data.color];
        const parity = data.result === 0 ? 'ноль' : (data.result % 2 === 0 ? 'четное' : 'нечетное');
        resultNumber.innerHTML = `<div class="alert alert-info">Выпало число: ${data.result}, ${colorText}, ${parity}</div>`;

        if (data.win) {
            winAmount.innerHTML = `<div class="alert alert-success">Выигрыш: ${data.win_amount}₽</div>`;
        } else {
            winAmount.innerHTML = '<div class="alert alert-danger">К сожалению, вы проиграли</div>';
        }

        updateBalance(data.balance);
        isSpinning = false;
    }, SPIN_DURATION_MS);
}

document.getElementById('bet-type').addEventListener('change', updateBetValue);
document.getElementById('spin-button').addEventListener('click', spin);
updateBetValue();
});
</script>
</body>
</html>
