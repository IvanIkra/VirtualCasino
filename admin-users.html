<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Управление пользователями</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-dark text-light" data-auth="admin">
<div class="container mt-4">
    <h2 class="text-light mb-4">Управление пользователями</h2>
    <div id="flash-area"></div>

    <div class="table-responsive">
        <table class="table table-dark table-striped">
            <thead>
                <tr>
                    <th class="text-light">Имя пользователя</th>
                    <th class="text-light">Баланс</th>
                    <th class="text-light">Админ</th>
                    <th class="text-light">Действия</th>
                </tr>
            </thead>
            <tbody id="users-body"></tbody>
        </table>
    </div>
</div>

<!-- Modal для изменения баланса -->
<div class="modal fade" id="balanceModal" tabindex="-1" aria-labelledby="balanceModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content bg-dark text-light">
            <div class="modal-header border-secondary">
                <h5 class="modal-title" id="balanceModalLabel">Изменение баланса пользователя</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form id="balance-form">
                <div class="modal-body">
                    <div class="mb-3">
                        <label for="amount" class="form-label">Сумма</label>
                        <input type="number" step="0.01" min="0.01" class="form-control bg-dark text-light border-secondary" id="amount" name="amount" required>
                    </div>
                    <div class="mb-3">
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="action" id="action-add" value="add" checked>
                            <label class="form-check-label" for="action-add">Добавить</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="action" id="action-subtract" value="subtract">
                            <label class="form-check-label" for="action-subtract">Вычесть</label>
                        </div>
                    </div>
                </div>
                <div class="modal-footer border-secondary">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                    <button type="submit" class="btn btn-primary">Сохранить</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/store.js"></script>
<script src="js/layout.js"></script>
<script>
Casino.ready(() => {
    const tbody = document.getElementById('users-body');
    const modalElement = document.getElementById('balanceModal');
    const modal = new bootstrap.Modal(modalElement);
    const form = document.getElementById('balance-form');
    let selectedUsername = null;

    function renderUsers() {
        tbody.innerHTML = '';
        Object.values(Casino.getUsers()).forEach(user => {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td class="text-light">${escapeHtml(user.username)}</td>
                <td class="text-light">${formatMoney(user.balance)}</td>
                <td class="text-light">${user.is_admin ? 'Да' : 'Нет'}</td>
                <td><button type="button" class="btn btn-primary btn-sm">Изменить баланс</button></td>`;
            row.querySelector('button').addEventListener('click', () => {
                selectedUsername = user.username;
                document.getElementById('balanceModalLabel').textContent = `Изменение баланса пользователя ${user.username}`;
                form.reset();
                modal.show();
            });
            tbody.appendChild(row);
        });
    }

    function showMessage(message, category) {
        const area = document.getElementById('flash-area');
        area.innerHTML = '';
        const div = document.createElement('div');
        div.className = `alert alert-${category}`;
        div.textContent = message;
        area.appendChild(div);
    }

    form.addEventListener('submit', event => {
        event.preventDefault();
        const action = form.querySelector('input[name="action"]:checked').value;
        const result = Casino.adminUpdateBalance(selectedUsername, document.getElementById('amount').value, action);
        modal.hide();
        if (result.ok) {
            showMessage(`Баланс пользователя ${selectedUsername} успешно обновлен`, 'success');
            const current = Casino.currentUser();
            if (current) updateBalance(current.balance);
        } else {
            showMessage(result.error, 'danger');
        }
        renderUsers();
    });

    renderUsers();
});
</script>
</body>
</html>
