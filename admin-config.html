<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редактировать конфигурацию</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-dark text-light" data-auth="admin">
<div class="container mt-4">
    <div class="container mt-5">
        <h2 class="mb-4" id="config-title">Редактировать конфигурацию</h2>
        <div id="flash-area"></div>

        <form id="config-form">
            <div class="form-group">
                <label for="config_data">Конфигурационные данные (JSON)</label>
                <textarea class="form-control" id="config_data" name="config_data" rows="15"></textarea>
            </div>
            <button type="submit" class="btn btn-primary mt-3">Сохранить изменения</button>
            <button type="button" class="btn btn-outline-warning mt-3" id="reset-button">Сбросить к стандартной</button>
            <a href="admin.html" class="btn btn-secondary mt-3">Отмена</a>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/store.js"></script>
<script src="js/layout.js"></script>
<script>
Casino.ready(() => {
    const gameType = new URLSearchParams(location.search).get('game');
    const config = gameType ? Casino.getConfig(gameType) : null;
    if (!config) {
        Casino.flash(`Конфигурация для игры ${gameType} не найдена.`, 'danger');
        location.replace('admin.html');
        return;
    }

    const capitalized = gameType.charAt(0).toUpperCase() + gameType.slice(1);
    document.title = `Редактировать ${capitalized} конфигурацию`;
    document.getElementById('config-title').textContent = document.title;

    const textarea = document.getElementById('config_data');
    textarea.value = JSON.stringify(config, null, 4);

    function showError(message) {
        const area = document.getElementById('flash-area');
        area.innerHTML = '';
        const div = document.createElement('div');
        div.className = 'alert alert-danger';
        div.textContent = message;
        area.appendChild(div);
    }

    document.getElementById('config-form').addEventListener('submit', event => {
        event.preventDefault();
        let parsed;
        try {
            parsed = JSON.parse(textarea.value);
        } catch (e) {
            showError('Ошибка: Неверный формат JSON.');
            return;
        }
        if (parsed === null || typeof parsed !== 'object' || Array.isArray(parsed)) {
            showError('Ошибка: конфигурация должна быть JSON-объектом.');
            return;
        }
        Casino.saveConfig(gameType, parsed);
        Casino.flash(`Конфигурация для игры ${gameType} успешно обновлена!`, 'success');
        location.href = 'admin.html';
    });

    document.getElementById('reset-button').addEventListener('click', () => {
        if (!confirm('Вернуть стандартную конфигурацию?')) return;
        Casino.saveConfig(gameType, null);
        Casino.flash(`Конфигурация для игры ${gameType} сброшена к стандартной.`, 'success');
        location.href = 'admin.html';
    });
});
</script>
</body>
</html>
